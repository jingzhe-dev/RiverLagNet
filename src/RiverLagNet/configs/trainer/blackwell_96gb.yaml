accelerator: gpu
devices: 1
precision: bf16-mixed
matmul_precision: high
fused_adamw: true
max_epochs: 100
max_steps: -1
effective_batch_size: 32
learning_rate: 0.001
weight_decay: 0.0001
nse_aux_weight: 0.0
warm_start_checkpoint: null
upstream_residual_only: false
upstream_gate_bias: -1.0
horizon_calibration_only: false
lag_refinement_only: false
deterministic: true
gradient_clip_val: 1.0
early_stopping_patience: 12
fast_dev_run: false
log_every_n_steps: 10
enable_progress_bar: false
gpu_lock_path: runs/.gpu0.lock
use_gpu_lock: true
