[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RiverLagNet"
version = "0.1.0"
description = "Directed lag-aware river-network water-quality forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "polars>=1.0",
  "pyarrow>=15",
  "torch>=2.1",
  "torch-geometric>=2.4",
  "lightning>=2.2",
  "matplotlib>=3.8",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
RiverLagNet = [
  "configs/*.yaml",
  "configs/data/*.yaml",
  "configs/model/*.yaml",
  "configs/trainer/*.yaml",
  "configs/experiment/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --basetemp=build/pytest"
filterwarnings = [
  "ignore:`torch.jit.script` is deprecated.*:DeprecationWarning:torch.jit._script",
  "ignore:GPU available but not used.*:UserWarning:lightning.pytorch.trainer.setup",
  'ignore:`isinstance\(treespec, LeafSpec\)` is deprecated.*',
  "ignore:The '.*_dataloader' does not have many workers.*:UserWarning:lightning.pytorch.trainer.connectors.data_connector",
]
